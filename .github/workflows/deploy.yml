name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "stage"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Production Branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site
      - name: Checkout Preview Branch
        uses: actions/checkout@v4
        with:
          ref: stage
          path: stage-site
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            main-site/package-lock.json
            stage-site/package-lock.json
      - name: Install + Build Production (main)
        working-directory: main-site
        run: |
          npm ci
          npm run build
      - name: Install + Build Preview (stage)
        working-directory: stage-site
        run: |
          npm ci
          npm run build
      - name: Assemble Pages Artifact
        run: |
          rm -rf out
          mkdir -p out/preview
          rsync -a main-site/dist/ out/
          rsync -a stage-site/dist/ out/preview/
      - name: Configure Pages
        uses: actions/configure-pages@v4
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
